#
# pr_jira_ticket.yml
#

name: pr-jira-ticket
on:
  pull_request:
    types: [opened, edited, reopened]

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title Format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          
          # Define the regex pattern for JIRA ticket format
          REGEX='^[A-Z]{2,8}-[0-9]{2,8}(:?\s|$)'
          
          # Check if title matches the pattern
          if echo "$PR_TITLE" | grep -qE "$REGEX"; then
            echo "✅ PR title is valid: $PR_TITLE"
            exit 0
          else
            echo "❌ PR title is invalid: $PR_TITLE"
            echo ""
            echo "The PR title must follow this format:"
            echo "  PROJECT-ID: Description"
            echo ""
            echo "Pattern: 2-8 uppercase letters, dash, 2-8 digits, followed by colon or space"
            echo ""
            echo "Examples:"
            echo "  ✅ DSOS-1234: Fix a critical issue"
            echo "  ✅ DAT-5678: Add new feature"
            echo "  ✅ GDOPS-999: Update documentation"
            echo "  ✅ AB-12 Feature name"
            exit 1
          fi