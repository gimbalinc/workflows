#
# pr_jira_ticket.yml
#

name: pr-jira-ticket
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches-ignore:
      - main
      - master

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title Format
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If triggered by push, find the PR for this branch
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Triggered by push event, finding associated PR..."
            PR_NUMBER=$(gh api repos/${{ github.repository }}/pulls \
              --jq ".[] | select(.head.ref==\"${GITHUB_REF#refs/heads/}\") | .number" | head -1)
            
            if [ -z "$PR_NUMBER" ]; then
              echo "✅ No PR found for this branch yet, skipping check"
              exit 0
            fi
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          
          # Fetch the current PR title from the GitHub API
          PR_TITLE=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.title')
          
          echo "Checking PR #$PR_NUMBER title: '$PR_TITLE'"
          echo "Title length: ${#PR_TITLE}"
          
          # Define the regex pattern for JIRA ticket format
          REGEX='^[A-Z]{2,8}-[0-9]{2,8}:'
          
          # Check if title matches the pattern
          if echo "$PR_TITLE" | grep -qE "$REGEX"; then
            echo "✅ PR title is valid!"
            exit 0
          else
            echo "❌ PR title is invalid"
            echo ""
            echo "The PR title must follow this format:"
            echo "  PROJECT-ID: Description"
            echo ""
            echo "Pattern: PROJECT-ID: where PROJECT is 2-8 uppercase letters and ID is 2-8 digits"
            echo ""
            echo "Examples:"
            echo "  ✅ DSOS-1234: Fix a critical issue"
            echo "  ✅ DAT-5678: Add new feature"
            echo "  ✅ GDOPS-999: Update documentation"
            exit 1
          fi